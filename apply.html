<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Careers · A Harare company</title>
<style>
:root{--bg:#eef2f1;--card:#fff;--tx:#17211d;--mu:#5d6b66;--bd:#d9e1de;--ac:#0b7a4b;--ac2:#0a5c3a;--ok:#1a7f4b;--er:#c0392b;--soft:#e7f3ed}
@media (prefers-color-scheme:dark){:root{--bg:#10171a;--card:#182125;--tx:#e8efec;--mu:#9fb0aa;--bd:#2a373c;--ac:#2fb37a;--ac2:#1f8f61;--ok:#4cc38a;--er:#ef7b6e;--soft:#15332a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
 background-image:radial-gradient(circle at 1px 1px,rgba(11,122,75,.07) 1px,transparent 0);background-size:22px 22px}
header{background:linear-gradient(120deg,#08452e,#0b7a4b 60%,#2fa57a);color:#fff;padding:26px 16px 58px}
.wrap{max-width:660px;margin:0 auto}
.brand{display:flex;align-items:center;gap:12px}
.logo{height:50px;width:auto;max-width:230px;background:#fff;border-radius:12px;padding:6px 12px;object-fit:contain;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.brand b{font-size:19px;letter-spacing:.2px}.brand span{display:block;font-size:12.5px;opacity:.85}
h1{font-size:27px;margin:20px 0 4px;line-height:1.2}
.hero p{margin:0;opacity:.92;max-width:520px}
main{max-width:660px;margin:-36px auto 0;padding:0 16px 40px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 6px 24px rgba(8,69,46,.08)}
.sec{font-size:12px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--ac);margin:20px 0 2px}
.sec:first-child{margin-top:0}
label{display:block;font-size:13.5px;font-weight:600;color:var(--tx);margin:12px 0 4px}
input,select,textarea,button{font:inherit;color:var(--tx)}
input[type=text],input[type=email],input[type=tel],select{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card)}
input:focus,select:focus{outline:2px solid var(--ac);outline-offset:1px;border-color:transparent}
input[type=file]{width:100%;padding:9px;border:1px dashed var(--bd);border-radius:10px;background:var(--soft);font-size:14px}
button{margin-top:18px;width:100%;padding:14px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-weight:700;font-size:16px;cursor:pointer}
button:hover{background:var(--ac2)}button:disabled{opacity:.6;cursor:wait}
.msg{padding:12px;border-radius:10px;margin-top:14px;display:none}.msg.err{display:block;border:1px solid var(--er);color:var(--er)}
.msg.ok{display:block;border:1px solid var(--ok);color:var(--ok)}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;font-weight:400;margin-top:18px;color:var(--tx)}.chk input{margin-top:4px;accent-color:var(--ac)}
.hp{position:absolute;left:-9999px}.small{font-size:13px;color:var(--mu)}
#req:not(:empty){background:var(--soft);border-radius:10px;padding:9px 12px;margin-top:8px;color:var(--tx)}
#done{text-align:center;padding:30px 20px}#done .tick{width:54px;height:54px;border-radius:50%;background:var(--soft);color:var(--ok);display:grid;place-items:center;font-size:28px;margin:0 auto 10px}
footer{text-align:center;color:var(--mu);font-size:12.5px;padding:0 16px 28px}
.cname{font-weight:700;font-size:17px;color:#fff;letter-spacing:.3px}</style></head><body>
<header><div class="wrap">
 <div class="brand"><div class="cname">A Harare company</div><span style="font-size:14px;opacity:.9;border-left:1px solid rgba(255,255,255,.4);padding-left:12px">Careers</span></div>
 <h1>Join our team</h1>
 <div class="hero"><p>Choose a vacancy, tell us about yourself and attach your documents. Our HR team reviews every application.</p></div>
</div></header>
<main>
<div id="done" class="card" style="display:none"></div>
<div id="formcard" class="card">
 <div class="sec">The position</div>
 <label for="vac">Vacancy</label><select id="vac"><option value="">Loading vacancies…</option></select>
 <div id="req" class="small"></div>
 <div class="sec">About you</div>
 <label for="name">Full name</label><input id="name" type="text" autocomplete="name">
 <label for="phone">Phone number</label><input id="phone" type="tel" autocomplete="tel" placeholder="e.g. 0771 234 567">
 <label for="email">Email address</label><input id="email" type="email" autocomplete="email">
 <label for="skills">Your key skills (comma separated)</label><input id="skills" type="text" placeholder="e.g. welding, electrical, driving licence">
 <div class="sec">Your documents</div>
 <label for="f1">Resume / CV</label><input id="f1" type="file" accept=".pdf,.jpg,.jpeg,.png,.docx">
 <label for="f2">Transcripts / certificates (you can select several)</label><input id="f2" type="file" multiple accept=".pdf,.jpg,.jpeg,.png,.docx">
 <label for="f3">Other documents (optional)</label><input id="f3" type="file" multiple accept=".pdf,.jpg,.jpeg,.png,.docx">
 <div class="small" style="margin-top:6px">PDF, Word, JPG or PNG. Maximum 10 MB per file.</div>
 <input class="hp" id="website" type="text" tabindex="-1" autocomplete="off" aria-hidden="true">
 <label class="chk"><input type="checkbox" id="consent"> I agree that the company may store my details and documents for up to 12 months and use them to consider me for this and future vacancies.</label>
 <button id="go">Submit application</button>
 <div id="msg" class="msg"></div>
</div>
</main>
<footer>A Harare company · Human Resources</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL="https://xsjwmqmdbrfpkhpnodsu.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_PPogPICjnAHv5dz-_G-MDw_sRzgGhUe";
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const MAX=10*1048576,OK=/\.(pdf|docx|jpe?g|png)$/i;
let vacs=[];
function show(t,cls){const m=$("msg");m.textContent=t;m.className="msg "+cls}
async function load(){
 const {data,error}=await sb.from("vacancies").select("id,title,department,required_skills,closing_date").order("created_at",{ascending:false});
 if(error){$("vac").innerHTML='<option value="">Could not load vacancies</option>';return show("Could not load vacancies. Please try again later.","err")}
 vacs=data||[];
 if(!vacs.length){$("vac").innerHTML='<option value="">No open vacancies right now</option>';return}
 $("vac").innerHTML='<option value="">Select a vacancy</option>'+vacs.map(v=>`<option value="${esc(v.id)}">${esc(v.title)}${v.department?" – "+esc(v.department):""}</option>`).join("");
 const pre=new URLSearchParams(location.search).get("v");if(pre&&vacs.some(v=>v.id===pre))$("vac").value=pre;showReq()}
function showReq(){const v=vacs.find(x=>x.id===$("vac").value);
 let t="";if(v){if(v.required_skills)t+="Skills wanted: "+v.required_skills;if(v.closing_date)t+=(t?"  ·  ":"")+"Closes: "+v.closing_date}
 $("req").textContent=t}
$("vac").onchange=showReq;
function safe(n){return n.replace(/[^a-zA-Z0-9._-]/g,"_").slice(-80)}
async function submit(){
 if($("website").value)return;
 const files=[["Resume",$("f1").files],["Transcript / certificate",$("f2").files],["Other",$("f3").files]];
 const name=$("name").value.trim(),phone=$("phone").value.trim(),email=$("email").value.trim();
 if(!$("vac").value)return show("Please choose a vacancy.","err");
 if(!name||(!phone&&!email))return show("Please enter your name and a phone number or email.","err");
 if(!$("consent").checked)return show("Please tick the consent box to continue.","err");
 for(const [k,fl] of files)for(const f of fl){
  if(!OK.test(f.name))return show(f.name+": please use PDF, Word, JPG or PNG.","err");
  if(f.size>MAX)return show(f.name+" is larger than 10 MB.","err")}
 $("go").disabled=true;show("Submitting… please wait and do not close this page.","ok");
 const id=crypto.randomUUID();
 const {error}=await sb.from("applications").insert({id,vacancy_id:$("vac").value,full_name:name,phone,email,skills:$("skills").value.trim(),consent_at:new Date().toISOString()});
 if(error){$("go").disabled=false;return show("Sorry, your application could not be submitted. Please try again.","err")}
 let failed=[];
 for(const [kind,fl] of files)for(const f of fl){
  const path=id+"/"+crypto.randomUUID()+"-"+safe(f.name);
  const up=await sb.storage.from("applicant-docs").upload(path,f,{contentType:f.type||undefined});
  if(up.error){failed.push(f.name);continue}
  const d=await sb.from("documents").insert({application_id:id,kind,file_name:f.name,storage_path:path});
  if(d.error)failed.push(f.name)}
 $("formcard").style.display="none";const dn=$("done");dn.style.display="block";
 dn.innerHTML="<div class='tick'>✓</div><b style='color:var(--ok);font-size:20px'>Application received</b><p>Thank you, "+esc(name)+". Your reference is <b>"+id.slice(0,8).toUpperCase()+"</b>. Keep it if you need to contact HR.</p>"+
  (failed.length?"<p style='color:var(--er)'>These files could not be uploaded: "+esc(failed.join(", "))+". Please contact HR and quote your reference.</p>":"");
 window.scrollTo(0,0)}
$("go").onclick=submit;load();
</script></body></html>
